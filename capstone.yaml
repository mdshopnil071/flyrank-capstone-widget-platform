run: "docker compose up --build"
seed: "python -m app.seed"
test: "pytest"
base_url: "http://localhost:8000"
endpoints:
  health: "/health"
  config: "/api/public/widgets/{id}/config"
  submit: "/api/public/widgets/{id}/submit"
  dashboard: "/api/dashboard/submissions"
  snippet: "/api/widgets/{id}/snippet"
  widget_stats: "/api/dashboard/widgets/{id}/stats"